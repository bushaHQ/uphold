name: uphold
description: >
  Flutter wrapper for Uphold Widget SDKs. Embeds Uphold's Payment and
  Travel Rule widgets via WebView with type-safe Dart event bridges.
version: 0.4.0
homepage: https://github.com/bushahq/uphold
repository: https://github.com/bushahq/uphold
issue_tracker: https://github.com/bushahq/uphold/issues

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.0
  webview_flutter_platform_interface: ^2.10.0

flutter:
  assets:
    - assets/payment_widget.html
    - assets/payment_widget_sdk.js
    - assets/travel_rule_widget.html
    - assets/travel_rule_widget_sdk.js
