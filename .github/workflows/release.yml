name: Release

on:
  push:
    tags:
      - 'v*' # e.g. v0.1.0, v1.0.0-beta.1

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build SDK (production)
        run: npm run build

      - name: Verify SDK was generated
        run: |
          if [ ! -f assets/payment_widget_sdk.js ]; then
            echo "::error::assets/payment_widget_sdk.js was not generated"
            exit 1
          fi
          echo "SDK size: $(wc -c < assets/payment_widget_sdk.js) bytes"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set pubspec version from tag
        run: |
          TAG_VERSION=${{ steps.version.outputs.version }}
          sed -i "s/^version: .*/version: $TAG_VERSION/" pubspec.yaml
          echo "pubspec.yaml version set to $TAG_VERSION"
          grep '^version:' pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Check formatting
        run: dart format . --set-exit-if-changed .

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub || echo "No tests found — skipping"

      - name: Validate pub publish
        run: flutter pub publish --dry-run

      - name: Package release artifact
        run: |
          mkdir -p release
          rsync -a \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='.vscode' \
            --exclude='.idea' \
            --exclude='*.iml' \
            --exclude='release' \
            ./ release/uphold_payment_widget/
          cd release
          zip -r uphold_payment_widget-${{ steps.version.outputs.version }}.zip uphold_payment_widget/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/uphold_payment_widget-${{ steps.version.outputs.version }}.zip