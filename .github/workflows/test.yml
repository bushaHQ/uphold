name: Test & Coverage

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Extract coverage percentage
        id: coverage
        run: |
          sudo apt-get install -y lcov > /dev/null 2>&1
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep 'lines' | sed 's/.*: \([0-9.]*\)%.*/\1/')
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: |
          PERCENT="${{ steps.coverage.outputs.percentage }}"
          if (( $(echo "$PERCENT >= 90" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$PERCENT >= 75" | bc -l) )); then
            COLOR="green"
          elif (( $(echo "$PERCENT >= 60" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${PERCENT}%\",\"color\":\"${COLOR}\"}" > coverage-badge.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage-badge.json
          git diff --cached --quiet || git commit -m "ci: update coverage badge [skip ci]" && git push
