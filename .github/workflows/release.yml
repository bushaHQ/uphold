name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get next version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: dev
          patchList: fix, bugfix, perf, refactor, test, tests, chore
          fallbackTag: v0.0.1

      - name: Update pubspec.yaml version
        run: |
          sed -i "s/^version: .*/version: ${{ steps.semver.outputs.nextStrict }}/" pubspec.yaml
          echo "pubspec.yaml version set to ${{ steps.semver.outputs.nextStrict }}"
          grep '^version:' pubspec.yaml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build SDK (production)
        run: npm run build

      - name: Verify SDKs were generated
        run: |
          for sdk in assets/payment_widget_sdk.js assets/travel_rule_widget_sdk.js; do
            if [ ! -f "$sdk" ]; then
              echo "::error::$sdk was not generated"
              exit 1
            fi
            echo "$sdk: $(wc -c < "$sdk") bytes"
          done

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Stage SDKs for commit (gitignored, needs force-add)
        run: git add -f assets/payment_widget_sdk.js assets/travel_rule_widget_sdk.js

      - name: Commit version bump + SDK
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: 'build(release): ${{ steps.semver.outputs.next }} [skip ci]'

      - name: Package release artifact
        run: |
          mkdir -p release
          rsync -a \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='.vscode' \
            --exclude='.idea' \
            --exclude='*.iml' \
            --exclude='release' \
            ./ release/uphold/
          cd release
          zip -r uphold-${{ steps.semver.outputs.nextStrict }}.zip uphold/

      - name: Create Release Entry
        uses: ncipollo/release-action@v1
        continue-on-error: true
        with:
          tag: ${{ steps.semver.outputs.next }}
          generateReleaseNotes: true
          artifacts: release/uphold-${{ steps.semver.outputs.nextStrict }}.zip
    outputs:
      tag: ${{ steps.semver.outputs.next }}

  update-changelog:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update CHANGELOG
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ needs.release.outputs.tag }}

      - name: Check if there are changes
        id: changes
        run: echo "changed=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT

      - name: Sync with main
        if: steps.changes.outputs.changed != 0
        run: git stash && git pull && git stash pop

      - name: Commit CHANGELOG.md
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: dev
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit_message: 'docs: ${{ needs.release.outputs.tag }} [skip ci]'
          file_pattern: CHANGELOG.md
